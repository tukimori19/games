<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひまつぶしゲーム広場</title>
<style>
:root{--bg:#fff6e3;--card:#fffaf0;--ink:#4a2a1a;--line:#7a4a22;--accent:#e8412f}
@media (prefers-color-scheme:dark){:root{--bg:#3d2c20;--card:#6d4b31;--ink:#fff1e0;--line:#2f1c0e}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;margin:8px 0 4px}
p.s{margin:0 0 20px;opacity:.8}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.g{display:block;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px 16px;color:inherit;text-decoration:none;box-shadow:0 4px 0 var(--line)}
a.g b{display:block;font-size:18px}
a.g span{font-size:13px;opacity:.75}
footer{margin-top:28px;font-size:13px;opacity:.8}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>ひまつぶしゲーム広場</h1>
<p class="s">スマホでもPCでも、すぐ遊べる無料ミニゲーム。</p>
<ul>
<!-- GAMES -->
<li><a class="g" href="./sushi/"><b>お寿司キャラ合体パズル</b><span>同じお寿司をタップして合体！大トロ大王を目指そう</span></a></li>
<li><a class="g" href="./onestroke/"><b>一筆書きパズル</b><span>すべての線を1回ずつなぞろう！ 終わりのないレベル制</span></a></li>
<li><a class="g" href="./blackhole/"><b>ブラックホール・スイーパー</b><span>カーソル（指）がブラックホール！ 45秒で画面を吸い尽くせ</span></a></li>
<li><a class="g" href="./mirrorcut/"><b>ミラー・カット</b><span>図形を1本の線でぴったり50%:50%に！ 60秒の一刀両断パズル</span></a></li>
<!-- /GAMES -->
</ul>
<footer>ゲームが気に入ったら <a href="https://buymeacoffee.com/tukimori" target="_blank" rel="noopener noreferrer">コーヒーを贈って応援</a> してもらえると嬉しいです。</footer>
</main>
</body>
</html>
