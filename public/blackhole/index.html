<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ブラックホール・スイーパー</title>
<style>
:root{--ink:#2b2d42;--card:#fff;--pink:#ff5c97;--teal:#2fb7a0;--yellow:#ffb62e;--violet:#7b2ff7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
html{background:linear-gradient(rgba(60,80,140,.07) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(60,80,140,.07) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(circle at 30% 20%,#ffffff,#e4eeff 60%,#f1e6ff);background-color:#e4eeff}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;will-change:transform}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
.hud{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;justify-content:center;padding:0 10px;pointer-events:none}
.pill{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:3px 10px;text-align:center;box-shadow:0 3px 0 var(--ink);min-width:0;flex:0 1 128px}
.pill small{display:block;font-size:11px;font-weight:800;opacity:.65;letter-spacing:.06em}
.pill b{font-size:22px;display:block;line-height:1.25;font-variant-numeric:tabular-nums}
#hTime.low b{color:#e8412f;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.35}}
.bar{height:6px;border-radius:99px;background:#dfe6f7;margin:1px 2px 3px;position:relative;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#00c2ff,#7b2ff7,#ff3d9a);width:0}
.bar u{position:absolute;left:90%;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
#hRate b{font-size:19px}
#combo{position:absolute;left:50%;top:max(84px,calc(env(safe-area-inset-top) + 74px));transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:40px;color:#ff3d9a;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 4px 0 rgba(43,45,66,.35);pointer-events:none;opacity:0;transition:opacity .25s}
#combo.show{opacity:1}
#combo.pop{animation:cpop .2s ease-out}
@keyframes cpop{0%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}
#hint{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;font-weight:800;font-size:15px;pointer-events:none;text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 6px #fff}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#mute{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;z-index:12;background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 #c88510}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(236,243,255,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;touch-action:none}
.ov.hidden{display:none}
.card{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px 20px 16px;text-align:center;width:min(92vw,400px)}
.card h1{margin:0;font-size:26px;line-height:1.25}
.card h2{margin:0;font-size:36px;color:var(--violet)}
.card p{margin:8px 0;font-size:15px;line-height:1.55}
.card .big{font-size:18px;font-weight:800}
.stats{display:flex;gap:8px;margin:10px 0}
.stats div{flex:1;background:#f1f4ff;border:3px solid var(--ink);border-radius:12px;padding:3px 4px}
.stats small{display:block;font-size:10px;font-weight:800;opacity:.65}
.stats b{font-size:18px;font-variant-numeric:tabular-nums}
button,a.b{font:inherit;font-weight:900;font-size:17px;color:#fff;background:var(--pink);border:0;border-radius:999px;padding:12px 26px;box-shadow:0 4px 0 #b8336a;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.2}
button:active,a.b:active{transform:translateY(3px);box-shadow:0 1px 0 #b8336a}
a.x{background:#111;box-shadow:0 4px 0 #000;font-size:15px;padding:10px 20px;margin-top:8px}
.links{margin-top:12px;font-size:13px}
.links a{color:var(--pink);font-weight:800}
#rBest{font-weight:800;min-height:1.4em;color:#e8412f}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud">
    <div class="pill" id="hTime"><small>TIME</small><b>45.0</b></div>
    <div class="pill" id="hRate"><small>吸収率</small><b>0%</b><div class="bar"><i></i><u></u></div></div>
    <div class="pill" id="hScore"><small>SCORE</small><b>0</b></div>
  </div>
  <div id="combo"></div>
  <div id="hint"></div>
</div>
<div id="flash"></div>
<button id="mute" aria-label="サウンド切替">♪</button>

<div id="title" class="ov">
  <div class="card">
    <h1>ブラックホール・<br>スイーパー</h1>
    <p>カーソル（指）が<b>ブラックホール</b>！<br>ごちゃごちゃの画面を吸い込んでスッキリしよう。</p>
    <p class="big">45秒で <b style="color:#7b2ff7">90%</b> 吸い込め！<br>そのあと…とんでもないことが起きる。</p>
    <button id="startBtn">スタート</button>
    <div class="links"><a href="../">ほかのゲームを見る</a></div>
  </div>
</div>

<div id="result" class="ov hidden">
  <div class="card">
    <h2 id="rTitle">CLEAR!</h2>
    <p id="rSub" class="big"></p>
    <div class="stats">
      <div><small>SCORE</small><b id="rScore">0</b></div>
      <div><small>最大コンボ</small><b id="rCombo">0</b></div>
      <div><small id="rLabel">クリアタイム</small><b id="rTime">0</b></div>
    </div>
    <p id="rBest"></p>
    <button id="retry">もう一度遊ぶ</button><br>
    <a id="share" class="b x" target="_blank" rel="noopener noreferrer">𝕏 で結果をシェア</a>
    <div class="links"><a href="../">ほかのゲームを見る</a>　|　<a href="https://buymeacoffee.com/tukimori" target="_blank" rel="noopener noreferrer">コーヒーで応援</a></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),cb=$('combo');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOTAL=340,LIMIT=45,TAU=Math.PI*2,CLEAR_AT=0.9,TOUCH_OFF=56;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0,dpr=1,osz=30,baseR=30,topPad=64;
let objs=[],parts=[],sprites=[];
let state='title',tLeft=LIMIT,absorbed=0,score=0,combo=0,comboT=0,maxCombo=0,clearTime=0,climaxT=0,r0=30,flashed=false,tt=0,shake=0,pulled=0,snap=false,hudAnims=[];
const hole={x:0,y:0,r:30,alpha:0,pulse:0};
const ptr={x:0,y:0,type:'mouse',active:false};
let muted=false,best=0;
try{muted=localStorage.getItem('bh_mute')==='1';best=+localStorage.getItem('bh_best')||0}catch(e){}

/* ---------- Audio ---------- */
let ac=null,master=null,humG=null,humO=null,humO2=null,noiseBuf=null,lastSuck=0;
function ensureAudio(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=1;master.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*1.8),ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=240;
      humG=ac.createGain();humG.gain.value=0;
      humO=ac.createOscillator();humO.type='sawtooth';humO.frequency.value=48;
      humO2=ac.createOscillator();humO2.type='sine';humO2.frequency.value=97;
      humO.connect(lp);humO2.connect(lp);lp.connect(humG);humG.connect(master);humO.start();humO2.start();
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
}
function tone(f0,f1,t0,dur,vol,type){
  if(muted||!ac)return;
  const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(f1,25),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
const SEMI=[0,2,4,7,9];
function sSuck(c){
  if(!ac||muted)return;
  const now=ac.currentTime;if(now-lastSuck<0.03)return;lastSuck=now;
  const idx=Math.min(c-1,24),f=392*Math.pow(2,(SEMI[idx%5]+12*Math.floor(idx/5))/12);
  tone(f*.78,f,0,.09,.14,'triangle');tone(f*2,f*2.02,0,.05,.035,'sine');
}
function sBoom(){
  if(!ac||muted)return;
  const t=ac.currentTime,src=ac.createBufferSource(),lp=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=noiseBuf;lp.type='lowpass';lp.frequency.setValueAtTime(9000,t);lp.frequency.exponentialRampToValueAtTime(120,t+1.4);
  g.gain.setValueAtTime(.75,t);g.gain.exponentialRampToValueAtTime(.001,t+1.55);
  src.connect(lp);lp.connect(g);g.connect(master);src.start(t);src.stop(t+1.7);
  tone(170,28,0,1.2,.7,'sine');tone(95,28,.05,.95,.5,'triangle');
  [1046,1568,2093,2637].forEach((f,i)=>tone(f,f*1.01,.3+i*.09,.9,.05,'sine'));
}
function sOver(){[494,415,349,262].forEach((f,i)=>tone(f,f*.96,i*.16,.3,.2,'triangle'))}
function updateHum(){
  if(!ac||!humG)return;
  let g=0,f=46;
  if(!muted){
    if(state==='play'||state==='ready'){g=hole.alpha>.3?.012+Math.min(pulled,14)*.0035+(absorbed/TOTAL)*.02:0;f=44+hole.r*.3+pulled*1.2}
    else if(state==='climax'){g=.05+Math.min(1,climaxT/2.2)*.1;f=50+climaxT*45}
  }
  const t=ac.currentTime;
  humG.gain.setTargetAtTime(g,t,.06);humO.frequency.setTargetAtTime(f,t,.08);humO2.frequency.setTargetAtTime(f*2.02,t,.08);
}
function setMute(){$('mute').textContent=muted?'✕':'♪'}setMute();
$('mute').addEventListener('click',()=>{muted=!muted;setMute();try{localStorage.setItem('bh_mute',muted?'1':'0')}catch(e){}ensureAudio()});
$('mute').addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------- Sprites ---------- */
const OUT='#2b2d42';
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function mkSprite(draw){
  const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');
  g.lineWidth=5;g.lineJoin='round';g.lineCap='round';g.strokeStyle=OUT;draw(g);return c;
}
function makeSprites(){
  sprites=[
  // 0 未読メール
  mkSprite(g=>{rr(g,10,22,76,54,9);g.fillStyle='#fff';g.fill();g.stroke();
    g.beginPath();g.moveTo(10,30);g.lineTo(48,57);g.lineTo(86,30);g.fillStyle='#dbe9ff';g.fill();g.stroke();
    g.beginPath();g.arc(78,24,13,0,TAU);g.fillStyle='#ff3b5c';g.fill();g.stroke();
    g.fillStyle='#fff';g.font='900 17px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('1',78,25)}),
  // 1 書類
  mkSprite(g=>{g.beginPath();g.moveTo(22,8);g.lineTo(60,8);g.lineTo(78,26);g.lineTo(78,88);g.lineTo(22,88);g.closePath();g.fillStyle='#fff';g.fill();g.stroke();
    g.beginPath();g.moveTo(60,8);g.lineTo(60,26);g.lineTo(78,26);g.fillStyle='#cfd8ff';g.fill();g.stroke();
    g.strokeStyle='#8a93b8';g.lineWidth=4;for(const y of[44,57,70]){g.beginPath();g.moveTo(34,y);g.lineTo(66,y);g.stroke()}}),
  // 2 時計
  mkSprite(g=>{for(const x of[22,74]){g.beginPath();g.arc(x,20,11,0,TAU);g.fillStyle='#ff5c97';g.fill();g.stroke()}
    g.beginPath();g.arc(48,52,34,0,TAU);g.fillStyle='#fff';g.fill();g.stroke();
    g.lineWidth=4;for(let i=0;i<4;i++){const a=i*Math.PI/2;g.beginPath();g.moveTo(48+Math.cos(a)*26,52+Math.sin(a)*26);g.lineTo(48+Math.cos(a)*30,52+Math.sin(a)*30);g.stroke()}
    g.lineWidth=5;g.beginPath();g.moveTo(48,52);g.lineTo(48,30);g.moveTo(48,52);g.lineTo(63,60);g.stroke();
    g.beginPath();g.arc(48,52,4,0,TAU);g.fillStyle=OUT;g.fill()}),
  // 3 エラー画面
  mkSprite(g=>{rr(g,8,14,80,68,10);g.fillStyle='#fff';g.fill();
    g.save();rr(g,8,14,80,68,10);g.clip();g.fillStyle='#ff5c5c';g.fillRect(8,14,80,20);g.restore();
    rr(g,8,14,80,68,10);g.stroke();g.beginPath();g.moveTo(8,34);g.lineTo(88,34);g.stroke();
    g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.moveTo(74,20);g.lineTo(82,28);g.moveTo(82,20);g.lineTo(74,28);g.stroke();
    g.strokeStyle=OUT;g.lineWidth=4;g.beginPath();g.moveTo(48,40);g.lineTo(67,73);g.lineTo(29,73);g.closePath();g.fillStyle='#ffd23a';g.fill();g.stroke();
    g.fillStyle=OUT;g.font='900 22px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('!',48,62)}),
  // 4 フォルダ
  mkSprite(g=>{rr(g,10,20,36,22,7);g.fillStyle='#ffb62e';g.fill();g.stroke();rr(g,10,32,76,50,9);g.fillStyle='#ffd96b';g.fill();g.stroke()}),
  // 5 付箋
  mkSprite(g=>{g.beginPath();g.moveTo(14,14);g.lineTo(82,14);g.lineTo(82,60);g.lineTo(60,82);g.lineTo(14,82);g.closePath();g.fillStyle='#fff176';g.fill();g.stroke();
    g.beginPath();g.moveTo(82,60);g.lineTo(60,60);g.lineTo(60,82);g.fillStyle='#f2d74a';g.fill();g.stroke();
    g.strokeStyle='#b59b00';g.lineWidth=4;g.beginPath();g.moveTo(26,36);g.lineTo(68,36);g.moveTo(26,50);g.lineTo(54,50);g.stroke();
    g.beginPath();g.arc(48,16,7,0,TAU);g.fillStyle='#ff3b5c';g.fill();g.strokeStyle=OUT;g.lineWidth=4;g.stroke()}),
  // 6 カレンダー
  mkSprite(g=>{rr(g,12,18,72,66,9);g.fillStyle='#fff';g.fill();
    g.save();rr(g,12,18,72,66,9);g.clip();g.fillStyle='#ff5c97';g.fillRect(12,18,72,22);g.restore();
    rr(g,12,18,72,66,9);g.stroke();g.fillStyle=OUT;rr(g,28,8,8,18,3);g.fill();rr(g,60,8,8,18,3);g.fill();
    g.font='900 30px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('25',48,62)}),
  // 7 チャット
  mkSprite(g=>{rr(g,10,14,76,50,16);g.fillStyle='#dff7ee';g.fill();g.stroke();
    g.beginPath();g.moveTo(30,62);g.lineTo(24,84);g.lineTo(50,62);g.fillStyle='#dff7ee';g.fill();g.stroke();
    g.fillStyle=OUT;for(const x of[32,48,64]){g.beginPath();g.arc(x,39,5,0,TAU);g.fill()}})
  ];
}

/* ---------- Layout ---------- */
function fit(){
  const nw=innerWidth,nh=innerHeight;
  dpr=Math.min(2,window.devicePixelRatio||1);
  if(W&&H){const sx=nw/W,sy=nh/H;for(const o of objs){o.x*=sx;o.y*=sy}hole.x*=sx;hole.y*=sy}
  W=nw;H=nh;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  osz=clamp(Math.sqrt(W*H/TOTAL)*.62,20,46);
  baseR=clamp(Math.sqrt(W*H)*.03,22,40);
  topPad=Math.max(64,$('hud').getBoundingClientRect().bottom+8);
}
addEventListener('resize',fit);
function layout(){
  objs=[];
  const aw=W-16,ah=H-topPad-8;
  const cols=Math.ceil(Math.sqrt(TOTAL*aw/ah)),rows=Math.ceil(TOTAL/cols),cw=aw/cols,ch=ah/rows;
  const cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)cells.push([c,r]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  for(let i=0;i<TOTAL;i++){
    const [c,r]=cells[i];
    objs.push({x:8+(c+.12+Math.random()*.76)*cw,y:topPad+(r+.12+Math.random()*.76)*ch,vx:0,vy:0,rot:(Math.random()-.5)*.9,vr:0,spin:Math.random()<.5?-1:1,s:1,ph:Math.random()*TAU,type:Math.floor(Math.random()*sprites.length),hue:Math.floor(Math.random()*360),dead:false});
  }
}

/* ---------- Game flow ---------- */
function resetGame(){
  hudAnims.forEach(a=>a.cancel());hudAnims=[];
  layout();parts=[];
  tLeft=LIMIT;absorbed=0;score=0;combo=0;comboT=0;maxCombo=0;clearTime=0;climaxT=0;flashed=false;shake=0;pulled=0;
  cb.classList.remove('show','pop');hole.alpha=0;hole.r=baseR;hole.pulse=0;
  $('flash').style.opacity=0;
  $('result').classList.add('hidden');
  state='ready';setHint('カーソル（指）を動かして吸い込め！');
  updateHud();
}
function beginPlay(){if(state==='ready'){state='play';setHint('')}}
function setHint(t){$('hint').textContent=t}
$('startBtn').addEventListener('click',()=>{ensureAudio();$('title').classList.add('hidden');resetGame()});
$('retry').addEventListener('click',()=>{ensureAudio();resetGame()});

function absorb(o){
  o.dead=true;absorbed++;
  combo=comboT>0?combo+1:1;comboT=.5;if(combo>maxCombo)maxCombo=combo;
  score+=10*Math.min(10,1+Math.floor(combo/5));
  hole.pulse=1;
  if(combo>=5&&!RM)shake=Math.max(shake,Math.min(combo,50)*.22);
  else if(combo>=5)shake=Math.max(shake,Math.min(combo,50)*.07);
  const n=2+Math.min(combo,32)/4|0;
  for(let i=0;i<n&&parts.length<900;i++){
    const a=Math.random()*TAU,sp=140+Math.random()*(220+Math.min(combo,40)*8);
    parts.push({k:0,x:hole.x+Math.cos(a)*hole.r*.9,y:hole.y+Math.sin(a)*hole.r*.9,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.45+Math.random()*.4,max:.85,r:2+Math.random()*3.5,c:`hsl(${(o.hue+i*14)%360},95%,60%)`});
  }
  sSuck(combo);
  if(combo>=5&&state==='play'){
    cb.textContent=combo+' COMBO!';cb.style.fontSize=Math.min(30+Math.min(combo,60)*.6,W*.1)+'px';cb.style.color=`hsl(${(combo*17)%360},95%,55%)`;
    cb.classList.add('show');cb.classList.remove('pop');void cb.offsetWidth;cb.classList.add('pop');
  }
}
function startClimax(){
  state='climax';climaxT=0;clearTime=LIMIT-tLeft;r0=hole.r;hole.alpha=1;
  setHint('');cb.classList.remove('show','pop');
  const els=[$('hTime'),$('hRate'),$('hScore')];
  els.forEach((el,i)=>{
    const r=el.getBoundingClientRect(),dx=W/2-(r.left+r.width/2),dy=H/2-(r.top+r.height/2);
    const a=el.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${(i%2?-1:1)*720}deg) scale(.02)`,opacity:.1}],
      {duration:1100+i*130,delay:350+i*160,easing:'cubic-bezier(.55,0,.9,.35)',fill:'forwards'});
    hudAnims.push(a);
  });
}
function doFlash(){
  flashed=true;sBoom();
  const f=$('flash');
  f.animate(RM?[{opacity:0},{opacity:.7,offset:.2},{opacity:0}]:[{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.55},{opacity:0}],{duration:RM?1500:1700,easing:'ease-out'});
  setTimeout(()=>{
    state='clear';objs.forEach(o=>o.dead=true);parts=[];hole.alpha=0;shake=0;
    showResult(true);
  },RM?500:420);
}
function endTimeUp(){
  state='over';tLeft=0;sOver();combo=0;comboT=0;cb.classList.remove('show','pop');setHint('');
  setTimeout(()=>showResult(false),700);
}
function countUp(el,to,ms){
  const t0=performance.now();
  (function f(t){const p=clamp((t-t0)/ms,0,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('ja-JP');if(p<1)requestAnimationFrame(f)})(t0);
}
function showResult(win){
  const pct=Math.floor(absorbed/TOTAL*100);
  let shareText,final=score;
  if(win){
    const bonus=Math.round(tLeft*100);final=score+bonus;
    $('rTitle').textContent='CLEAR!';$('rTitle').style.color='#7b2ff7';
    $('rSub').textContent=`${clearTime.toFixed(2)}秒で吸い尽くした！`+(bonus?`（タイムボーナス +${bonus.toLocaleString('ja-JP')}）`:'');
    $('rLabel').textContent='クリアタイム';$('rTime').textContent=clearTime.toFixed(2)+'秒';
    let rec=false;
    if(!best||clearTime<best){rec=!!best;best=clearTime;try{localStorage.setItem('bh_best',String(best))}catch(e){}}
    $('rBest').textContent=rec?'🎉 ベストタイム更新！':`ベストタイム ${best.toFixed(2)}秒`;
    shareText=`ブラックホール・スイーパーを${clearTime.toFixed(1)}秒でクリア！最大${maxCombo}コンボ #ブラックホールスイーパー`;
  }else{
    const need=Math.max(0,Math.ceil(TOTAL*CLEAR_AT)-absorbed);
    $('rTitle').textContent='TIME UP';$('rTitle').style.color='#e8412f';
    $('rSub').textContent=`吸収率 ${pct}%　クリアまであと${need}個！`;
    $('rLabel').textContent='吸収率';$('rTime').textContent=pct+'%';
    $('rBest').textContent=best?`ベストタイム ${best.toFixed(2)}秒`:'';
    shareText=`ブラックホール・スイーパーで吸収率${pct}%！クリアまであと${need}個… #ブラックホールスイーパー`;
  }
  $('rCombo').textContent=maxCombo;
  $('share').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText)+'&url='+encodeURIComponent(location.href.split('#')[0]);
  $('result').classList.remove('hidden');
  countUp($('rScore'),final,900);
}

/* ---------- Update ---------- */
function updateHud(){
  const t=$('hTime');t.querySelector('b').textContent=tLeft.toFixed(1);t.classList.toggle('low',tLeft<10&&state==='play');
  const f=absorbed/TOTAL;
  $('hRate').querySelector('b').textContent=Math.floor(f*100)+'%';
  $('hRate').querySelector('i').style.width=Math.min(100,f*100)+'%';
  $('hScore').querySelector('b').textContent=score.toLocaleString('ja-JP');
}
function step(dt){
  tt+=dt;
  if(state==='play'){tLeft-=dt;if(tLeft<=0)endTimeUp()}
  if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;cb.classList.remove('show','pop')}}
  const frac=absorbed/TOTAL;
  let pullOn=false;
  if(state==='climax'){
    climaxT+=dt;
    const k=1-Math.exp(-3.5*dt);hole.x+=(W/2-hole.x)*k;hole.y+=(H/2-hole.y)*k;
    const p=Math.min(1,climaxT/2.1),R=Math.hypot(W,H)*.62;
    hole.r=r0+(R-r0)*Math.pow(p,2.6);hole.alpha=1;pullOn=true;
    shake=Math.max(shake,(3+p*9)*(RM?.3:1));
    if(!flashed&&climaxT>=2.3)doFlash();
  }else if(state==='play'||state==='ready'){
    const tx=ptr.x,ty=ptr.y-(ptr.type==='touch'?TOUCH_OFF:0);
    if(snap){hole.x=tx;hole.y=ty;snap=false}
    else{const k=1-Math.exp(-38*dt);hole.x+=(tx-hole.x)*k;hole.y+=(ty-hole.y)*k}
    hole.alpha+=((ptr.active?1:0)-hole.alpha)*(1-Math.exp(-18*dt));
    const tr=baseR*(1+1.5*Math.min(frac/CLEAR_AT,1));
    hole.r+=(tr*(1+hole.pulse*.1)-hole.r)*(1-Math.exp(-14*dt));
    pullOn=state==='play'&&ptr.active&&hole.alpha>.4;
  }else if(state==='over'){hole.alpha+=(0-hole.alpha)*(1-Math.exp(-8*dt))}
  hole.pulse=Math.max(0,hole.pulse-dt*6);

  // physics
  const n=2,h=dt/n;
  const pullR=state==='climax'?1e9:hole.r*1.7+12;
  const G=1300+hole.r*8;
  pulled=0;
  for(let s=0;s<n;s++){
    for(const o of objs){
      if(o.dead)continue;
      const dx=hole.x-o.x,dy=hole.y-o.y,d2=dx*dx+dy*dy;
      let d=0,k=0,inPull=false;
      if(pullOn&&d2<pullR*pullR){
        d=Math.sqrt(d2)||.001;inPull=true;
        const ux=dx/d,uy=dy/d;let a;
        if(state==='climax'){a=500+climaxT*2200;k=1}
        else{k=1-d/pullR;a=G*(.15+.85*k)*k}
        o.vx+=(ux*a-uy*a*.6)*h;o.vy+=(uy*a+ux*a*.6)*h;
        o.vr+=o.spin*16*k*h;
        const dm=Math.exp(-1.4*h);o.vx*=dm;o.vy*=dm;
        if(s===n-1)pulled++;
      }else{
        const dm=Math.exp(-5*h);o.vx*=dm;o.vy*=dm;o.vr*=Math.exp(-3*h);
        d=Math.sqrt(d2);
      }
      o.vr=clamp(o.vr,-30,30);
      o.x+=o.vx*h;o.y+=o.vy*h;o.rot+=o.vr*h;
      if(o.x<4){o.x=4;o.vx=Math.abs(o.vx)*.4}else if(o.x>W-4){o.x=W-4;o.vx=-Math.abs(o.vx)*.4}
      if(o.y<4){o.y=4;o.vy=Math.abs(o.vy)*.4}else if(o.y>H-4){o.y=H-4;o.vy=-Math.abs(o.vy)*.4}
      if(inPull){
        const ab=state==='climax'?hole.r*.55:hole.r*.42;
        if(d<ab||(state==='climax'&&climaxT>2.2)){absorb(o);continue}
      }
      const ts=(inPull&&d<hole.r*1.25)?clamp(d/(hole.r*1.25),.12,1):1;
      o.s+=(ts-o.s)*Math.min(1,16*h);
    }
  }
  if(state==='play'&&absorbed/TOTAL>=CLEAR_AT)startClimax();

  // particles
  if(pullOn&&parts.length<900){
    const cnt=state==='climax'?4:2;
    for(let i=0;i<cnt;i++){const rad=hole.r*(1.2+Math.random()*1.3);parts.push({k:1,a:Math.random()*TAU,rad,rv:rad*1.3,w:(3.5+Math.random()*3)*(Math.random()<.5?-1:1),life:.55,max:.55})}
  }
  for(const p of parts){
    p.life-=dt;
    if(p.k===0){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.vx*=Math.exp(-1.5*dt)}
    else{p.a+=p.w*dt;p.rad-=p.rv*dt;if(p.rad<hole.r*.5)p.life=0}
  }
  parts=parts.filter(p=>p.life>0);

  // shake
  shake*=Math.exp(-7*dt);
  if(shake>.05)stage.style.transform=`translate(${((Math.random()-.5)*2*shake).toFixed(1)}px,${((Math.random()-.5)*2*shake).toFixed(1)}px)`;
  else if(stage.style.transform)stage.style.transform='';

  // hint
  if(state==='play'){setHint(frac>=.8?'あと少し！！ 90%で…？':'')}
  updateHud();updateHum();
}

/* ---------- Draw ---------- */
function drawHole(){
  if(hole.alpha<.01)return;
  const x=hole.x,y=hole.y,r=hole.r;
  ctx.save();ctx.globalAlpha=hole.alpha;
  if(state==='play'||state==='ready'){
    ctx.setLineDash([6,8]);ctx.lineWidth=1.5;ctx.strokeStyle='rgba(123,47,247,.28)';ctx.beginPath();ctx.arc(x,y,r*1.7+12,0,TAU);ctx.stroke();ctx.setLineDash([]);
  }
  const g=ctx.createRadialGradient(x,y,r*.8,x,y,r*2.3);
  g.addColorStop(0,'rgba(123,47,247,.55)');g.addColorStop(.5,'rgba(0,180,255,.18)');g.addColorStop(1,'rgba(123,47,247,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.3,0,TAU);ctx.fill();
  ctx.lineCap='round';
  const cols=['#ff7a18','#ff3d9a','#7b2ff7','#00c2ff'];
  for(let i=0;i<4;i++){
    const rr_=r*(1.12+i*.17),a0=tt*(2.6-i*.5)*(i%2?-1:1)+i*1.7;
    ctx.lineWidth=Math.max(2,r*(.1-i*.016));ctx.strokeStyle=cols[i];
    ctx.beginPath();ctx.arc(x,y,rr_,a0,a0+Math.PI*(1.3-i*.12));ctx.stroke();
  }
  ctx.fillStyle='#07020f';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.lineWidth=Math.max(2,r*.05);ctx.strokeStyle='rgba(190,150,255,.9)';ctx.stroke();
  ctx.lineWidth=Math.max(1.5,r*.025);ctx.strokeStyle='rgba(150,110,255,.5)';
  for(let i=0;i<3;i++){const a0=tt*(3.5+i)+i*2.1;ctx.beginPath();ctx.arc(x,y,r*(.35+i*.2),a0,a0+1.6);ctx.stroke()}
  ctx.restore();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  for(const o of objs){
    if(o.dead)continue;
    const wob=o.s>.99?Math.sin(tt*1.4+o.ph):0;
    const a=o.rot+wob*.06,sz=osz*o.s,c=Math.cos(a)*dpr,s=Math.sin(a)*dpr;
    ctx.setTransform(c,s,-s,c,o.x*dpr,(o.y+wob*1.2)*dpr);
    ctx.globalAlpha=Math.min(1,o.s*1.6);
    ctx.drawImage(sprites[o.type],-sz/2,-sz/2,sz,sz);
  }
  ctx.globalAlpha=1;ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const p of parts){
    if(p.k===0){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}
    else{ctx.globalAlpha=Math.max(0,p.life/p.max)*.8;ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.arc(hole.x+Math.cos(p.a)*p.rad,hole.y+Math.sin(p.a)*p.rad,2.2,0,TAU);ctx.fill()}
  }
  ctx.globalAlpha=1;
  drawHole();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(dt>0){step(dt)}
  draw();requestAnimationFrame(frame);
}

/* ---------- Input ---------- */
function setPtr(e){
  const r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;
  ptr.type=(e.pointerType==='touch'||e.pointerType==='pen')?'touch':'mouse';
}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();setPtr(e);ptr.active=true;snap=true;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  beginPlay();
});
cv.addEventListener('pointermove',e=>{
  setPtr(e);
  if(ptr.type==='mouse'){if(!ptr.active)snap=true;ptr.active=true}
  beginPlay();
});
const up=e=>{if(e.pointerType==='touch'||e.pointerType==='pen')ptr.active=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr.active=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

fit();makeSprites();layout();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
</script>
</body>
</html>
